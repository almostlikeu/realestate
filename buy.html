<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy | mypropsearch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

    <nav class="nav-top w-full px-6 py-4 md:px-12 flex justify-between items-center">
        <a href="index.html" class="logo-text">mypropsearch</a>
        <a href="contact.html" class="btn-solid">Contact Us</a>
    </nav>
    <nav class="nav-bottom w-full px-6 py-4 md:px-12 flex justify-center md:justify-start gap-6 md:gap-10 overflow-x-auto">
        <a href="buy.html" class="subnav-link active">BUY</a>
        <a href="sell.html" class="subnav-link">SELL</a>
        <a href="off-plan.html" class="subnav-link">OFF-PLAN PROPERTIES</a>
        <a href="whats-new.html" class="subnav-link">WHAT'S NEW IN DUBAI</a>
        <a href="visa-property.html" class="subnav-link">VISA THROUGH PROPERTY</a>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <h1 class="serif text-4xl mb-8 text-center text-[#333333]">Available Properties</h1>
        
        <!-- Filters (Same as Index) -->
        <div class="search-container w-full max-w-6xl flex flex-col md:flex-row mb-12 mx-auto border border-gray-200">
            <div class="search-field md:w-2/5 relative">
                <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Area</p>
                <div class="tag-container"></div>
                <input type="text" class="area-input w-full bg-transparent border-none outline-none text-sm font-medium placeholder-gray-400" placeholder="Type a community...">
                <div class="autocomplete-dropdown"></div>
            </div>
            <div class="search-field md:w-1/4">
                <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Property Type</p>
                <select class="search-select font-sans">
                    <option value="">All Types</option>
                    <option value="apartment">Apartment</option>
                    <option value="villa">Villa</option>
                </select>
            </div>
            <div class="search-field md:w-1/4">
                <p class="text-xs text-gray-500 font-medium mb-1 uppercase tracking-wider">Price Range (AED)</p>
                <select class="search-select font-sans">
                    <option value="">Any Price</option>
                    <option value="1M-3M">1M - 3M</option>
                    <option value="10M+">10M+</option>
                </select>
            </div>
            <div class="md:w-auto flex-grow flex">
                <button class="btn-solid w-full h-full rounded-none md:rounded-r flex items-center justify-center gap-2 py-4 md:py-0 text-base">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
        
        <!-- Property Grid -->
        <div class="grid md:grid-cols-3 gap-8 text-center">
            <div class="group cursor-pointer intent-card border-none bg-transparent hover:transform-none hover:shadow-none p-0 text-left">
                <div class="aspect-[4/3] overflow-hidden mb-4 rounded-sm">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                </div>
                <p class="text-xs text-gray-500 uppercase tracking-widest mb-1 font-medium">The Villa</p>
                <h3 class="serif text-xl mb-2 text-[#333333]">Hacienda Estate</h3>
                <p class="text-[--brand-teal] font-semibold mb-3">AED 7,300,000</p>
                <div class="flex gap-4 text-sm text-gray-600 border-t border-gray-200 pt-3">
                    <span>5 Beds</span>
                    <span>6 Baths</span>
                    <span>6,200 sq ft</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
